[package]
name = "store-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
project-format = { path = "../project-format" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
