[package]
name = "wp-linux-x11-adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "wp-linux-x11-adapter"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
x11rb = { version = "0.13", features = ["randr"] }
zbus = "5"
