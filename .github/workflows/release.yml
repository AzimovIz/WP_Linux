name: Release

# Manual only -- no push/schedule trigger. Tag defaults to today's date
# (YYYY.MM.DD); override via the "tag" input if you need to build more
# than once in a day or re-cut a specific date.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: today's date, YYYY.MM.DD)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      # Resolved before the build (rather than after, like the archive
      # staging below) so wp_linux_editor's build.rs can bake it into the
      # binary as WP_LINUX_RELEASE_TAG -- shown in the About window.
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          fi

      # Everything Wayland/Vulkan/D-Bus-related is dlopen'd at runtime,
      # not linked at build time (see `ldd` on any built binary) -- no
      # apt packages needed here, just the Rust toolchain.
      - name: Build release binaries
        run: cargo build --release --workspace
        env:
          WP_LINUX_RELEASE_TAG: ${{ steps.tag.outputs.tag }}

      # Single archive, laid out the way install.sh/PKGBUILD expect:
      #   bin/{render-server,player,wp_linux_editor}
      #   adapters/kde/{plasma-plugin,kwin-script}/package  (kpackagetool6-ready)
      #   adapters/gnome/  (placeholder, no adapter implemented yet)
      #   dev.wplinux.editor.desktop  (Exec= has an @EDITOR_BIN@ placeholder,
      #                                 filled in by install.sh/PKGBUILD)
      #   assets/{wp_linux_editor_128.png,wp_linux_editor_256.png,wp_linux_editor.svg}
      # No systemd unit -- render-server autostarts via an XDG autostart
      # .desktop file that install.sh writes directly (and wp_linux_editor's
      # own "Launch at login" checkbox manages afterwards), nothing to ship
      # here for it.
      # tar, not zip, so the executable bit on bin/* survives extraction.
      # Fixed filename (no tag in it) so install.sh can pull it via
      # GitHub's stable releases/latest/download/<name> URL without
      # calling the API to resolve the current tag.
      - name: Stage release archive
        run: |
          set -eu
          root=dist/wp-linux
          mkdir -p "$root/bin"
          cp target/release/render-server target/release/player target/release/wp_linux_editor "$root/bin/"
          cp -r adapters "$root/adapters"
          cp packaging/dev.wplinux.editor.desktop "$root/"
          cp -r assets "$root/assets"
          tar czf dist/wp-linux-linux-x86_64.tar.gz -C dist wp-linux

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/wp-linux-linux-x86_64.tar.gz
            install.sh
            uninstall.sh
