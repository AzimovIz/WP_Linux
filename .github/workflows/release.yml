name: Release

# Manual only -- no push/schedule trigger. Tag defaults to today's date
# (YYYY.MM.DD); override via the "tag" input if you need to build more
# than once in a day or re-cut a specific date.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: today's date, YYYY.MM.DD)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Minimum glibc to link against, not the glibc on this runner --
      # zig supplies its own bundled glibc version headers/libs, so the
      # host OS's actual glibc is irrelevant to compatibility here.
      # 2.31 = Ubuntu 20.04 (Feb 2020); bump only if a dependency needs
      # newer symbols cargo-zigbuild can't satisfy at this version.
      ZIG_TARGET: x86_64-unknown-linux-gnu.2.31
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      # Resolved before the build (rather than after, like the archive
      # staging below) so wp_linux_editor's build.rs can bake it into the
      # binary as WP_LINUX_RELEASE_TAG -- shown in the About window.
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          fi

      # Everything Wayland/Vulkan/D-Bus-related is dlopen'd at runtime,
      # not linked at build time (see `ldd` on any built binary) -- only
      # the glibc symbol versions pulled in by std matter here, which is
      # exactly what `zigbuild`'s target suffix controls. `--workspace`
      # also builds `shader-preview`, used below. Output lands in
      # target/x86_64-unknown-linux-gnu/release/, not target/release/.
      - name: Build release binaries
        run: cargo zigbuild --release --workspace --target "$ZIG_TARGET"
        env:
          WP_LINUX_RELEASE_TAG: ${{ steps.tag.outputs.tag }}

      # `shader-preview` (see that crate's module doc comment) needs a
      # real wgpu adapter, and this runner has no GPU -- Mesa's software
      # implementations stand in: lavapipe for Vulkan, llvmpipe for GL,
      # either of which satisfies `player::pick_adapter`'s
      # `wgpu::Backends::all()` request. Same approach wgpu's own CI uses
      # for its GPU tests on `ubuntu-24.04` runners (see
      # gfx-rs/wgpu/.github/workflows/ci.yml); unlike that workflow we
      # don't need a pinned custom Mesa build, since rendering a handful
      # of simple fullscreen post-process shaders is far less demanding
      # than wgpu's own conformance suite -- the distro package is enough.
      - name: Install Mesa software renderer (for shader preview generation)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri

      # One `.gif` per `shaders/*.wgsl`, written next to its source (see
      # `shader-preview`'s own doc comment) -- picked up by the archive
      # staging step below alongside the `.wgsl` files themselves.
      - name: Generate shader previews
        run: |
          set -eu
          for f in shaders/*.wgsl; do
            echo "generating preview for $f"
            target/x86_64-unknown-linux-gnu/release/shader-preview "$f"
          done

      # Single archive, laid out the way install.sh expects:
      #   bin/{render-server,player,wp_linux_editor}
      #   adapters/kde/{plasma-plugin,kwin-script}/package  (kpackagetool6-ready)
      #   adapters/gnome/extension/  (GNOME Shell extension, gnome-extensions-ready)
      #   dev.wplinux.editor.desktop  (Exec= has an @EDITOR_BIN@ placeholder,
      #                                 filled in by install.sh)
      #   assets/{wp_linux_editor_128.png,wp_linux_editor_256.png,wp_linux_editor.svg}
      #   shaders/{*.wgsl,*.gif}  (bundled shader library + previews,
      #                             installed to ~/.local/share/wp_linux/shaders
      #                             by install.sh)
      # No systemd unit -- render-server autostarts via an XDG autostart
      # .desktop file that install.sh writes directly (and wp_linux_editor's
      # own "Launch at login" checkbox manages afterwards), nothing to ship
      # here for it.
      # tar, not zip, so the executable bit on bin/* survives extraction.
      # Fixed filename (no tag in it) so install.sh can pull it via
      # GitHub's stable releases/latest/download/<name> URL without
      # calling the API to resolve the current tag.
      - name: Stage release archive
        run: |
          set -eu
          root=dist/wp-linux
          mkdir -p "$root/bin"
          cp target/x86_64-unknown-linux-gnu/release/render-server target/x86_64-unknown-linux-gnu/release/player target/x86_64-unknown-linux-gnu/release/wp_linux_editor "$root/bin/"
          cp -r adapters "$root/adapters"
          cp packaging/dev.wplinux.editor.desktop "$root/"
          cp -r assets "$root/assets"
          cp -r shaders "$root/shaders"
          tar czf dist/wp-linux-linux-x86_64.tar.gz -C dist wp-linux

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/wp-linux-linux-x86_64.tar.gz
            install.sh
            uninstall.sh
